<!doctype html>
<html>
  <head>
    <title>Filter Class in Tailwind CSS</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <h1>Original Image</h1>
    <img src="funny_monkey.jpg" alt="hello">
    <h1>Blurred Image</h1>
    <img class="blur" src="funny_monkey.jpg" alt="">
    <img class="blur-sm" src="funny_monkey.jpg" alt="">
    <img class="blur-md" src="funny_monkey.jpg" alt="">
    <img class="blur-lg" src="funny_monkey.jpg" alt="">
    <img class="blur-xl" src="funny_monkey.jpg" alt="">
    <h1>Brightness</h1>
    <img class="brightness-50" src="funny_monkey.jpg" alt=""/>
    <img class="brightness-100" src="funny_monkey.jpg" alt=""/>
    <img class="brightness-125" src="funny_monkey.jpg" alt=""/>
    <img class="brightness-150" src="funny_monkey.jpg" alt=""/>
    <img class="brightness-200" src="funny_monkey.jpg" alt=""/>

    <h1>Contrast Image</h1>
    <img class="contrast-0" src="funny_monkey.jpg" alt="">
     <img class="contrast-50" src="funny_monkey.jpg" alt="">
      <img class="contrast-100" src="funny_monkey.jpg" alt="">
       <img class="contrast-150" src="funny_monkey.jpg" alt="">
        <img class="contrast-200" src="funny_monkey.jpg" alt="">
         <img class="contrast-250" src="funny_monkey.jpg" alt="">

    <h1>Gray Scale</h1>
    <img class="grayscale" src="funny_monkey.jpg" alt=""/>
    <img class="grayscale-100" src="funny_monkey.jpg" alt=""/>
    <img class="grayscale-125" src="funny_monkey.jpg" alt=""/>
    <img class="grayscale-150" src="funny_monkey.jpg" alt=""/>
    <img class="grayscale-200" src="funny_monkey.jpg" alt=""/>     

    <h1>Invert</h1>
    <img class="invert" src="funny_monkey.jpg" alt="">

    <h1>hue</h1>
    <img class="hue-rotate" src="funny_monkey.jpg" alt=""/>
    <img class="hue-rotate-100" src="funny_monkey.jpg" alt=""/>
    <img class="hue-rotate-125" src="funny_monkey.jpg" alt=""/>
    <img class="hue-rotate-150" src="funny_monkey.jpg" alt=""/>
    <img class="hue-rotate-200" src="funny_monkey.jpg" alt=""/>    

    
  </body>
</html>
