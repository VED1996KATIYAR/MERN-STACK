<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!--flex-->
    <div class="flex">
        <div class="bg-green-400 size-25">1</div>
        <div class="bg-red-400 size-25">2</div>
        <div class="bg-yellow-400 size-25">3</div>
        <div class="bg-cyan-400 size-25">4</div>
        <div class="bg-pink-400 size-25">5</div>
    </div>

    <div class="flex-col">
        <div class="bg-green-400 size-25">1</div>
        <div class="bg-red-400 size-25">2</div>
        <div class="bg-yellow-400 size-25">3</div>
        <div class="bg-cyan-400 size-25">4</div>
        <div class="bg-pink-400 size-25">5</div>
    </div>

    <div class="flex flex-col-reverse">
        <div class="bg-green-400 size-25">1</div>
        <div class="bg-red-400 size-25">2</div>
        <div class="bg-yellow-400 size-25">3</div>
        <div class="bg-cyan-400 size-25">4</div>
        <div class="bg-pink-400 size-25">5</div>
    </div>

    <div class="flex flex-row-reverse">
        <div class="bg-green-400 size-25">1</div>
        <div class="bg-red-400 size-25">2</div>
        <div class="bg-yellow-400 size-25">3</div>
        <div class="bg-cyan-400 size-25">4</div>
        <div class="bg-pink-400 size-25">5</div>
    </div>

    <div class="flex items-center">
        <div class="bg-green-400 size-25">1</div>
        <div class="bg-red-400 size-25">2</div>
        <div class="bg-yellow-400 size-25">3</div>
        <div class="bg-cyan-400 size-25">4</div>
        <div class="bg-pink-400 size-25">5</div>
    </div>
  </body>
</html>
