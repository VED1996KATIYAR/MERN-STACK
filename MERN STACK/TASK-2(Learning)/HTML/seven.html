<html>
    <head>
        <title>Unorder List</title>
    </head>
    <body>
        <h1>Unorder List</h1>
        <ul type="disc">
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>         
        </ul>
        <ul type="circle">
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>         
        </ul>
        <ul type="square">
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>         
        </ul>
        <ul type="none">
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>         
        </ul>
    </body>
</html>
