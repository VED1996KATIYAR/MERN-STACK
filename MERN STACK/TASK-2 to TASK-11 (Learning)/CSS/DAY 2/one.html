<!-- 1. Basic Selectors
Basic selectors in CSS are simple tools used for selecting by 
HTML element name (e.g., h1), class (.class Name), ID (#idName),
 or universally (* for all elements).

1 . Universal Selector (*): Selects all elements on the page and applies 
the same style universally. 
-->

<html>
    <head>
        <title>Universal Selector</title>
        <style>
            *{
                color: blueviolet;
                font-size: 40px;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>Header Text</h1>
        <p>Paragraph Text</p>
    </body>
</html>
