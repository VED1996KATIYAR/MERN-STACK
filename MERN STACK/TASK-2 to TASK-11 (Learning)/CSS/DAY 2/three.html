<!--Class Selector: (.): Applies styles to elements with a specific class attribute.-->
<html>
    <head>
        <title>Class Selector</title>
        <style>
            .button{
                background-color: brown;
                color:white;
            }
        </style>
    </head>
    <body>
        <button class="button">Click Me!</button>
    </body>
</html>
