<!--2. Element Selector: Targets all elements of a specific type, such as paragraphs or headers-->
<html>
    <head>
        <title>ELement Selector</title>
        <style>
            p{
                font-size: 18px;
                color: black;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <p>This paragraph styled with font size 16px</p>
    </body>
</html>
