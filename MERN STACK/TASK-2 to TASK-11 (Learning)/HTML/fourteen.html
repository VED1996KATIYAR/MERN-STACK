<html>
    <head>
        <title>Form1</title>
    </head>
    <body>
        <h1>Form1</h1>
        <form>
            <fieldset>
                <legend align="center" >Personal Information</legend>
            Name:<input type="text" name="name" value="" placeholder="Enter your name" autofocus=""/>
            <br/>
            <br/>
            Address:<textarea name="address" placeholder="Enter your address"></textarea>
            <br/>
            <br/>
            Gender:
            <input type="radio" name="gender" value="m"/>Male
            <input type="radio" name="gender" value="f"/>Female
            <input type="radio" name="gender" value="o"/>Other
            <br/>
            <br/>
            <input type="submit" value="Send"/>
            <input type="reset" value="Reset"/>
            <br/>
            <br/>
            Country:
            <select>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
                <option value="au">Australia</option>
                <option value="de">Germany</option>
                <option value="fr">France</option>
                <option value="jp">Japan</option>
                <option value="cn">China</option>
                <option value="in">India</option>
                <option value="br">Brazil</option>
                <option value="ru">Russia</option>
                <option value="it">Italy</option>
                <option value="es">Spain</option>
                <option value="mx">Mexico</option>
                <option value="kr">South Korea</option>
                <option value="sa">Saudi Arabia</option>
                <option value="ng">Nigeria</option>
                <option value="eg">Egypt</option>
                <option value="ar">Argentina</option>
            </select>
            <br/>
            <br/>
            Hobbies::
            <input type="checkbox" name="hobby[]" value="sports"/>Sports
            <input type="checkbox" name="hobby[]" value="music"/>Music
            <input type="checkbox" name="hobby[]" value="travel"/>Travel
            <input type="checkbox" name="hobby[]" value="reading"/>Reading
            <input type="checkbox" name="hobby[]" value="gaming"/>Gaming
            <input type="checkbox" name="hobby[]" value="cooking"/>Cooking
            <input type="checkbox" name="hobby[]" value="art"/>Art
            <input type="checkbox" name="hobby[]" value="photography"/>Photography
            <br/>
            </fieldset>
        </form>
    </body>
</html>
