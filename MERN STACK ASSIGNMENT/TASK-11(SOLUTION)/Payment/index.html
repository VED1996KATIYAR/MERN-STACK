<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <div class="container1">
            <h4 style="color: black;">Checkout</h4>
            <br/>
            <h3>Contact Details</h3>
            <br/>
            <h4>Email ID</h4>
            <input type="text" placeholder="John Doe"/>
            
            <h4>Payment</h4>
            <div class="hell">
                <div class="hell1">
                    <div class="hell11">
                        💳 Card
                    </div>
                    <div class="hell12">₿ Crypto</div>
                    <div class="hell13">🏦 Bank</div>
                    <div class="hell14"> •••</div>
                </div>
                <br/>
                <h3>Card Number</h3>
                <input class="input1" type="text" placeholder="John Doe"/>
                <br/>
                <div style="display: flex; gap: 10px;">
                    <div>
                        <h4>Expiry</h4>
                        <input class="expiry" placeholder="MM/YY"/>
                    </div>
                    <div>
                        <h4>CVC</h4>
                        <input class="cvc" placeholder=":::"/>
                    </div>
                </div>
                <br/>
                <div style="display: flex; gap: 10px;">
                    <div>
                        <h4>Country</h4>
                        <input class="country" placeholder="India"/>
                    </div>
                    <div>
                        <h4>ZIP</h4>
                        <input class="zip" type="text" placeholder="XXXXX">
                    </div>
                </div>

            </div>
        </div>
     <div class="container1">
        <div style="text-align: center; font-weight: bold; font-size: 50px;">Order Summary</div>
        <div class="right1">
        <div class="right11">

            <label>Enter Coupon Code</label>

            <div class="coupon">
                <input type="text" placeholder="COUPON CODE">
                <button>Apply Coupon</button>
            </div>

            <div class="price-details">

                <div class="row">
                    <span>Sub Total</span>
                    <span>₹4,700</span>
                </div>

                <div class="row">
                    <span>Taxes(if applicable)</span>
                    <span>₹199</span>
                </div>

                <div class="row">
                    <span>Discount</span>
                    <span>₹0</span>
                </div>

                <div class="row total">
                    <span>Total</span>
                    <span>₹4,999</span>
                </div>

            </div>

        </div>

        <button class="pay-btn">Pay Now ₹4,999</button>

        <div class="payment">
            🛡️ SECURE
            <b>Razorpay</b>
            🛡️ SECURE
        </div>
     </div>
     </div>
    </div>
  </div>
</body>
</html>
