<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">LOGO</div>

        <ul class="nav-menu">
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONTACT US</a></li>
            <li><a href="#">SERVICES</a></li>
        </ul>

        <button class="username-btn">Username</button>
    </nav>

    <section class="hero-section">

        <div class="hero-content">

            <h1>
                Revitalize Your Clothes with Expert
                <span>Laundry Services!</span>
            </h1>

            <p>
                From premium dry cleaning to swift wash and fold,
                we deliver care and convenience. Schedule a pickup
                and rediscover the freshness of your clothes today!
            </p>

            <button class="service-btn">
                Book a service today!
            </button>

        </div>

        <div class="hero-image">
            <img src="img.jpg" alt="Laundry service">
        </div>

    </section>

</body>
</html>
