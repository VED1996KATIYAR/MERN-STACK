<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project AI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="text-gray-900">

    <!-- ================= NAVBAR ================= -->

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md">

        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

            <!-- Logo -->
            <div class="font-bold text-lg">
                ✦ Project
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center gap-6">

                <a href="#" class="text-sm text-gray-600 hover:text-black">
                    Product
                </a>

                <a href="#" class="text-sm text-gray-600 hover:text-black">
                    Solutions
                </a>

                <a href="#" class="text-sm text-gray-600 hover:text-black">
                    Resources
                </a>

                <a href="#" class="text-sm text-gray-600 hover:text-black">
                    Pricing
                </a>

                <a href="#" class="text-sm text-gray-600 hover:text-black">
                    Log in
                </a>

                <button class="bg-black text-white px-4 py-2 rounded-md text-sm">
                    Get AI free →
                </button>

            </div>

        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <section class="bg-gradient-to-b from-orange-50 to-white">

        <div class="text-center pt-16 pb-20 px-6">

            <!-- Heading -->
            <h1 class="text-5xl font-bold leading-tight text-gray-900">

                Write, plan, share.
                <br>

                With AI at your side.

            </h1>


            <!-- Description -->
            <p class="mt-6 max-w-xl mx-auto text-gray-500">

                It is the connected workspace for better, faster work.
                Now with AI.

            </p>


            <!-- CTA Buttons -->
            <div class="relative mt-8 flex justify-center gap-3">

                <button
                    class="bg-black text-white px-5 py-2.5 rounded-md text-sm hover:bg-gray-800">

                    Get AI free →

                </button>

                <button
                    class="bg-blue-600 text-white px-5 py-2.5 rounded-md text-sm hover:bg-blue-700">

                    Request a demo

                </button>

            </div>


            <!-- ================= DASHBOARD ================= -->

            <div class="relative max-w-5xl mx-auto mt-12 h-[400px]">


                <!-- Dashboard Image -->

                <img
                    src="office.webp"
                    alt="Dashboard"
                    class="absolute left-1/2 -translate-x-1/2 top-10 w-[500px] rounded-lg shadow-xl"
                >


                <!-- Tasks Card -->

                <div
                    class="absolute left-10 top-24 z-10 bg-white p-4 rounded-lg shadow-lg">

                    <div class="text-xs text-gray-500">
                        📋 Tasks
                    </div>

                    <p class="text-sm font-semibold mt-1">
                        12 tasks completed today
                    </p>

                </div>


                <!-- Project Status -->

                <div
                    class="absolute right-10 top-20 z-10 bg-white p-4 rounded-lg shadow-lg">

                    <div class="text-xs text-gray-500">
                        ✓ Project Status
                    </div>

                    <p class="text-sm font-semibold text-green-600 mt-1">
                        On Track
                    </p>

                </div>


                <!-- Team Activity -->

                <div
                    class="absolute right-16 bottom-16 z-10 bg-white p-4 rounded-lg shadow-lg">

                    <div class="text-xs text-gray-500">
                        Team Activity
                    </div>

                    <div class="flex items-center gap-2 mt-2">

                        <div class="flex -space-x-2">

                            <img
                                src="p1.webp"
                                class="w-7 h-7 rounded-full border-2 border-white"
                            >

                            <img
                                src="p2.webp"
                                class="w-7 h-7 rounded-full border-2 border-white"
                            >

                            <img
                                src="p3.webp"
                                class="w-7 h-7 rounded-full border-2 border-white"
                            >

                        </div>

                        <span class="text-xs text-gray-600">
                            +5 online
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </section>


    

    <div class="fixed bottom-6 right-6 z-50">

        <button
            class="w-12 h-12 bg-black text-white rounded-lg shadow-lg">

            💬

        </button>

    </div>

</body>

</html>
