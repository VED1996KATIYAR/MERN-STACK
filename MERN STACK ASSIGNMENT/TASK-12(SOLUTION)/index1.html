
<head>
   
    <title>Compound Interest Calculator</title>
</head>
<style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .input-group { margin-bottom: 15px; }
    label { display: inline-flex; width: 150px; }
    #result {color:blue; font-weight:bold; }
</style>
<body>
    <h1>Compound Interest Calculator</h1>
    <br/>
    <div class="input-group">
        <label>Principal (P):</label>
        <input type="number" id="principal" placeholder="like 1000">
    </div>
    <br/>
    <div class="input-group">
        <label>Rate of Interest (r):</label>
        <input type="number"  id="rate" placeholder="like 0.05">
    </div>
    <br/>
    <div class="input-group">
        <label>Compounding Frequency (n):</label>
        <input type="number" id="Compounding" placeholder="like 12">
    </div>
    <br/>
    <div class="input-group">
        <label>Time in Years (t):</label>
        <input type="number" id="time" placeholder="like 2">
    </div>
    <br/>
    <button onclick="calculate()">Calculate</button>
    <br/>    
    <div id="result"></div>
</body>
<script src="script.js"></script>
</html>
